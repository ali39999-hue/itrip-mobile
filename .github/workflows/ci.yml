name: Mobile Quality & Invariant Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Verify TypeScript & Domain Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Static Code Analysis & Linting
        run: npm run lint

      - name: Run Domain & Financial Invariant Tests
        run: npm run test

      - name: Verify 5-Language i18n Parity
        run: npm run i18n:parity

      - name: Verify Mobile Production Bundle Compilation
        run: npm run build:bundle
