name: Mobile Quality & Invariant Gate CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Verify TypeScript, Domain & Production Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation (Zero Errors)
        run: npm run typecheck

      - name: Static Code Analysis & Linting (Zero Warnings)
        run: npm run lint

      - name: Run Domain, Financial & Critical E2E Tests
        run: npm run test

      - name: Verify 5-Language i18n Parity (100% Keys Synced)
        run: npm run i18n:parity

      - name: Verify Mobile Production Bundle Compilation
        run: npm run build:bundle

      - name: Upload Exported Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itrip-mobile-android-bundle
          path: dist/
          retention-days: 7
